<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Odyssey Winter Grand Prix 2026 – Rise of the Titans</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--navy:#07122a;--deep:#0d1d3d;--panel:#112549;--line:#27406b;--ice:#9fd8f7;--gold:#e3b653;--gold2:#a97c24;--ivory:#f4ecd6;--mute:#8da3c4;--green:#1f9d55;--red:#d33a3a;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{color-scheme:dark;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--navy);color:var(--ivory);font:16px/1.5 Barlow,Arial,sans-serif}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0;letter-spacing:.02em}
.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-weight:700}
button{font:inherit;cursor:pointer;color:var(--ivory);background:var(--deep);border:1px solid var(--line);border-radius:6px;padding:8px 14px}
button:hover{border-color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.hero{position:relative;background:#000}
.hero img{display:block;width:100%;max-height:70vh;object-fit:cover;object-position:center top}
.hero:after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(transparent,var(--navy))}
.bar{display:flex;gap:8px;justify-content:flex-end;padding:10px 16px;max-width:1180px;margin:0 auto}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:-8px auto 8px}
.stat{background:var(--deep);border:1px solid var(--line);border-top:3px solid var(--gold);border-radius:8px;padding:12px 14px}
.stat b{display:block;font-size:30px;line-height:1.1;color:var(--gold)}
.stat span{color:var(--mute);font-size:14px}
section{padding:28px 0 4px}
h2{font-size:24px;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;gap:12px}
h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--gold2),transparent)}
.legs{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:12px}
.leg{background:linear-gradient(180deg,var(--panel),var(--deep));border:1px solid var(--line);border-radius:8px;padding:14px;position:relative;overflow:hidden}
.leg.done{border-color:var(--gold2)}
.leg.next{border-color:var(--ice);box-shadow:0 0 0 1px var(--ice) inset}
.leg .n{font-size:15px;color:var(--ice)}
.leg h3{font-size:14px;margin:2px 0 6px;color:var(--ivory)}
.leg .c{font-size:13px;color:var(--mute);min-height:38px}
.leg .w{margin-top:10px;font-size:14px;border-top:1px solid var(--line);padding-top:8px}
.tag{display:inline-block;font-size:12px;border-radius:99px;padding:1px 9px;background:#1c3463;color:var(--ice)}
.done .tag{background:var(--gold2);color:#fff}
.awards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.award{display:flex;gap:14px;align-items:center;padding:16px;border-radius:10px;border:1px solid var(--gold2);background:radial-gradient(120% 140% at 0 0,#1b3a73,var(--deep))}
.award .ph{flex:none}
.award small{color:var(--ice);font-size:14px}
.award h3{font-size:19px;color:var(--gold)}
.award .nm{font-size:26px;line-height:1.1}
.av{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--gold);background:var(--panel);display:grid;place-items:center;font:700 24px 'Barlow Condensed',sans-serif;color:var(--gold)}
.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tabs button[aria-pressed=true]{background:var(--gold);color:#1a1200;border-color:var(--gold);font-weight:500}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:10px;align-items:end;margin-bottom:18px}
.pod{text-align:center;background:linear-gradient(180deg,var(--panel),var(--deep));border:1px solid var(--line);border-radius:10px 10px 0 0;padding:14px 8px}
.pod .av{margin:0 auto 6px}
.pod.p1{padding-top:26px;border-color:var(--gold)}.pod.p1 .av{border-color:gold;width:84px;height:84px}
.pod.p2 .av{border-color:silver}.pod.p3 .av{border-color:#cd7f32}
.pod .nm{font-weight:500}.pod .pt{font-size:26px;color:var(--gold)}
.hint{color:var(--mute);margin:0 0 14px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:640px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line)}
th{background:var(--deep);color:var(--gold);font:600 14px Cinzel,serif;position:sticky;top:0}
td.nm{text-align:left;white-space:nowrap}
tbody tr:nth-child(odd){background:#0b1a36}
tr.top td:first-child{box-shadow:inset 3px 0 var(--gold)}
.r1{color:gold}.r2{color:silver}.r3{color:#cd7f32}
.tot{font-size:22px;color:var(--gold)}
.th{width:34px;height:34px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:8px;border:2px solid var(--gold);background:var(--panel);display:inline-grid;place-items:center;font:700 13px 'Barlow Condensed',sans-serif;color:var(--gold)}
.sb{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px}
.m{background:var(--ice)}.f{background:#f0a6c8}
input[type=text],input[type=number],select{background:#08152e;color:var(--ivory);border:1px solid var(--line);border-radius:5px;padding:5px;font:inherit}
input[type=number]{width:58px;text-align:center}input[type=text]{width:130px}
.roster{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.card{background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:center}
.card .av{margin:0 auto 8px}
.card h3{font-size:15px}
.card .bars{display:flex;gap:3px;justify-content:center;margin:8px 0 2px;align-items:flex-end;height:26px}
.card .bars i{width:10px;background:linear-gradient(var(--gold),var(--gold2));border-radius:2px 2px 0 0;min-height:2px}
.card input[type=file]{width:100%;font-size:12px;margin-top:6px}
footer{padding:28px 16px 36px;text-align:center;color:var(--mute);font-size:14px}
@media (max-width:560px){.podium{grid-template-columns:1fr}.podium .p2{order:2}.podium .p3{order:3}.pod{border-radius:10px}}
@media (prefers-reduced-motion:no-preference){.pod.p1{animation:rise .8s ease-out}@keyframes rise{from{transform:translateY(24px);opacity:0}}}
</style>
</head>

<script>
const PASSWORD="TITAN", KEY="odyssey_data_v2";
const LEGS=[
["The Journey Begins","Trojan Kitchen Invasion"],
["The Cyclops Encounter","Cyclops Smash"],
["The Winds of Aeolus","Aeolus Spin Masters"],
["Circe's Enchanted Island","Circe Dink Spell"],
["The Deadly Passage","Charybdis Rally Storm"],
["The Final Road to Glory","Ithaca Match Point"]];
let admin=false, view="all", dirty=false, data=fresh();

function fresh(){
 const p=[];
 for(let i=1;i<=12;i++)p.push({name:"Titan "+i,g:i<=6?"M":"F",photo:"",scores:[0,0,0,0,0,0]});
 return{players:p};
}
function draft(){try{return JSON.parse(localStorage.getItem(KEY));}catch(e){return null;}}
function edit(){
 dirty=true;
 try{localStorage.setItem(KEY,JSON.stringify({dirty:true,players:data.players}));}catch(e){}
 refresh();
}

/* Background music: music.mp3 (same folder as this page), looped */
const bgm=document.getElementById("bgm");
let soundOn=true,started=false,fadeT=null;
try{soundOn=localStorage.getItem("odyssey_sound")!=="0";}catch(e){}
function fadeTo(v,ms,done){
 clearInterval(fadeT);
 const s=bgm.volume,st=Date.now();
 fadeT=setInterval(()=>{
  const k=Math.min(1,(Date.now()-st)/ms);
  bgm.volume=s+(v-s)*k;
  if(k>=1){clearInterval(fadeT);if(done)done();}
 },50);
}
function startMusic(){
 started=true;
 if(bgm.paused)bgm.volume=0;
 const r=bgm.play();
 if(r&&r.then)r.then(()=>fadeTo(.6,2500)).catch(()=>{});else fadeTo(.6,2500);
}
function stopMusic(){fadeTo(0,400,()=>bgm.pause());}
function updSound(){document.getElementById("sndBtn").textContent="Music: "+(soundOn?"on":"off");}
function toggleSound(){
 soundOn=!soundOn;
 try{localStorage.setItem("odyssey_sound",soundOn?"1":"0");}catch(e){}
 updSound();
 soundOn?startMusic():stopMusic();
}
function firstTap(e){
 if(e.target.closest&&e.target.closest("#sndBtn"))return;
 document.removeEventListener("pointerdown",firstTap);
 if(soundOn&&!started)startMusic();
}
document.addEventListener("pointerdown",firstTap);
document.addEventListener("visibilitychange",()=>{
 if(!started)return;
 if(document.hidden)bgm.pause();
 else if(soundOn)bgm.play().catch(()=>{});
});
async function init(){
 updSound();
 let pub=null;
 try{const r=await fetch("data.json?t="+Date.now(),{cache:"no-store"});if(r.ok)pub=await r.json();}catch(e){}
 const dr=draft();
 if(pub&&pub.players)data={players:pub.players};
 if(dr&&dr.dirty&&dr.players){
  if(pub&&JSON.stringify(pub.players)===JSON.stringify(dr.players)){try{localStorage.removeItem(KEY);}catch(e){}}
  else{data={players:dr.players};dirty=true;}
 }
 refresh();
}
function exportData(){
 const blob=new Blob([JSON.stringify({players:data.players})],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="data.json";a.click();
}
function discard(){
 if(!confirm("Throw away your unpublished edits and reload the published data?"))return;
 try{localStorage.removeItem(KEY);}catch(e){}
 location.reload();
}
function renderBanner(){
 document.getElementById("dirtyMsg").textContent=dirty
  ?"You have unpublished changes. Download data.json, then upload it to GitHub to show them to everyone."
  :"No unpublished changes.";
}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const total=p=>p.scores.reduce((a,b)=>a+b,0);
const ini=n=>n.split(/\s+/).map(w=>w[0]).join("").slice(0,2).toUpperCase();
const thumb=p=>p.photo?`<img class="th" alt="" src="${p.photo}">`:`<span class="th">${esc(ini(p.name))}</span>`;
const av=p=>p.photo?`<img class="av" alt="" src="${p.photo}">`:`<div class="av">${esc(ini(p.name))}</div>`;
function ranked(f){return data.players.filter(p=>!f||f==="all"||p.g===f).sort((a,b)=>total(b)-total(a)||a.name.localeCompare(b.name));}

function renderStats(){
 const all=data.players, pts=all.reduce((a,p)=>a+total(p),0);
 const scored=LEGS.filter((_,b)=>all.some(p=>p.scores[b]>0)).length;
 const lead=ranked("all")[0];
 document.getElementById("stats").innerHTML=
 [[all.length,"Titans in the arena"],[scored+" / 6","Battles scored"],[pts?esc(lead.name):"–","Overall leader"]]
 .map(s=>`<div class="stat"><b class="num">${s[0]}</b><span>${s[1]}</span></div>`).join("");
}
function renderLegs(){
 const all=data.players;
 const next=LEGS.findIndex((_,b)=>!all.some(p=>p.scores[b]>0));
 document.getElementById("legs").innerHTML=LEGS.map((l,b)=>{
  const top=[...all].sort((x,y)=>y.scores[b]-x.scores[b])[0];
  const done=all.some(p=>p.scores[b]>0);
  return`<div class="leg ${done?"done":b===next?"next":""}">
  <div class="n num">LEG ${b+1} <span class="tag">${done?"Scored":b===next?"Up next":"Upcoming"}</span></div>
  <h3>${l[0]}</h3><div class="c">${l[1]} Challenge</div>
  <div class="w">${done?`Leader: <b>${esc(top.name)}</b> <span class="num">${top.scores[b]}</span>`:"Awaiting results"}</div></div>`;}).join("");
}
function renderAwards(){
 const box=(f,t,s)=>{const r=ranked(f)[0];const on=r&&total(r)>0;
  return`<div class="award"><div class="ph">${on?av(r):`<div class="av">?</div>`}</div>
  <div><small>${s}</small><h3>${t}</h3><div class="nm">${on?esc(r.name):"Up for grabs"}</div>
  <small class="num">${on?total(r)+" pts":"No points yet"}</small></div></div>`;};
 document.getElementById("awards").innerHTML=box("M","The Odysseus Award","Men's champion")+box("F","The Athena Award","Women's champion");
}
function renderTabs(){
 const t=[["all","Overall"],["M","Men"],["F","Women"]];
 document.getElementById("tabs").innerHTML=t.map(x=>`<button aria-pressed="${view===x[0]}" onclick="view='${x[0]}';refresh()">${x[1]}</button>`).join("");
}
function renderPodium(){
 const s=ranked(view).slice(0,3), el=document.getElementById("podium");
 if(s.length<3||!total(s[0])){el.innerHTML=`<p class="hint">The podium appears once points are on the board.</p>`;el.style.display="block";return;}
 el.style.display="";
 const o=[1,0,2];
 el.innerHTML=o.map(i=>`<div class="pod p${i+1}">${av(s[i])}<div class="num r${i+1}" style="font-size:22px">${["1st","2nd","3rd"][i]}</div><div class="nm">${esc(s[i].name)}</div><div class="pt num">${total(s[i])} pts</div></div>`).join("");
}
function renderStandings(){
 const s=ranked(view);
 let h=`<thead><tr><th>#</th><th>Player</th>${LEGS.map((_,b)=>`<th>L${b+1}</th>`).join("")}<th>Total</th>${admin?"<th></th>":""}</tr></thead><tbody>`;
 s.forEach((p,r)=>{const i=data.players.indexOf(p);
  h+=`<tr class="${r<3&&total(p)?"top":""}"><td class="num ${r<3?"r"+(r+1):""}">${r+1}</td>
  <td class="nm">${thumb(p)}<span class="sb ${p.g==="M"?"m":"f"}" title="${p.g==="M"?"Men":"Women"}"></span>${admin?`<input type="text" aria-label="Name" value="${esc(p.name)}" onchange="upd(${i},'name',this.value)"> <select aria-label="Category" onchange="upd(${i},'g',this.value)"><option value="M"${p.g==="M"?" selected":""}>M</option><option value="F"${p.g==="F"?" selected":""}>W</option></select> <input type="file" accept="image/*" aria-label="Photo for ${esc(p.name)}" style="width:100px;font-size:11px" onchange="uploadPhoto(event,${i})">`:esc(p.name)}</td>`;
  p.scores.forEach((v,b)=>h+=`<td>${admin?`<input type="number" min="0" aria-label="Leg ${b+1}" value="${v}" onchange="setScore(${i},${b},this.value)">`:v}</td>`);
  h+=`<td class="tot num">${total(p)}</td>${admin?`<td><button aria-label="Remove ${esc(p.name)}" onclick="removePlayer(${i})">Remove</button></td>`:""}</tr>`;});
 document.getElementById("standings").innerHTML=h+"</tbody>";
}
function renderRoster(){
 document.getElementById("roster").innerHTML=[...ranked("M").slice(0,6),...ranked("F").slice(0,6)].map((p,r)=>{const i=data.players.indexOf(p);
  const mx=Math.max(1,...p.scores);
  return`<div class="card">${av(p)}<h3>${esc(p.name)}</h3><div class="num" style="color:var(--gold);font-size:20px">${total(p)} pts</div>
  <div class="bars" title="Points per leg">${p.scores.map(v=>`<i style="height:${Math.round(v/mx*26)}px"></i>`).join("")}</div>
  <small style="color:var(--mute)">${p.g==="M"?"Odysseus Award":"Athena Award"}</small>
  ${admin?`<input type="file" accept="image/*" aria-label="Photo for ${esc(p.name)}" onchange="uploadPhoto(event,${i})">`:""}</div>`;}).join("");
}
function refresh(){renderStats();renderLegs();renderAwards();renderTabs();renderPodium();renderStandings();renderRoster();renderBanner();}

function toggleAdmin(){
 if(admin){admin=false;}
 else{const pw=prompt("Admin password");if(pw===null)return;if(pw!==PASSWORD){alert("Wrong password. Try again.");return;}admin=true;}
 document.getElementById("adminActions").hidden=!admin;
 document.getElementById("adminBtn").textContent=admin?"Log out of admin":"Admin login";
 refresh();
}
function upd(i,k,v){data.players[i][k]=v;edit();}
function setScore(i,b,v){data.players[i].scores[b]=Math.max(0,parseInt(v)||0);edit();}
function addPlayer(){data.players.push({name:"New Titan",g:view==="F"?"F":"M",photo:"",scores:[0,0,0,0,0,0]});edit();}
function removePlayer(i){if(confirm("Remove "+data.players[i].name+"?")){data.players.splice(i,1);edit();}}
function resetScores(){if(confirm("Set every score back to 0?")){data.players.forEach(p=>p.scores=[0,0,0,0,0,0]);edit();}}
function uploadPhoto(e,i){
 const f=e.target.files[0];if(!f)return;
 const r=new FileReader();
 r.onload=x=>{const im=new Image();im.onload=()=>{
  const c=document.createElement("canvas"),s=160;c.width=c.height=s;
  const m=Math.min(im.width,im.height);
  c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,s,s);
  data.players[i].photo=c.toDataURL("image/jpeg",.8);edit();};im.src=x.target.result;};
 r.readAsDataURL(f);
}
init();
</script>
</body>
</html>
